[workspace]
resolver = "2"
members = [
    "crates/relay-proto",
    "crates/relay-store",
    "crates/relay-net",
    "crates/relay-tls",
    "crates/relay-server",
    "crates/relay-bench",
]
# The adversarial suite is its own workspace: it builds the store with fault
# injection, which must never be unified into a release build of the relay.
exclude = ["adversarial"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

# The whole runtime dependency list. Anything not here is ours.
[workspace.dependencies]
relay-proto = { path = "crates/relay-proto" }
relay-store = { path = "crates/relay-store" }
relay-net = { path = "crates/relay-net" }
relay-tls = { path = "crates/relay-tls" }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "signal", "io-util"] }
secp256k1 = { version = "0.33", default-features = false, features = ["std"] }
sha2 = { version = "0.10", features = ["asm", "compress"] }
libc = "0.2"
# Events are read with our own nostr-parse (in place: its spans mode), and the
# record is written from what it found.
nostr-parse = "0.3"
# TLS and cryptography are never written in-house: rustls (ring provider, no
# aws-lc), its tokio glue, ring for the ACME account's signatures, and the CA
# trust store our ACME client uses. Only relay-tls depends on them at run time,
# and relay-net's `tls` feature (wss:// to other relays, for sync).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
ring = "0.17"
# Dev-only: reference implementations our own code is cross-checked against.
serde_json = "1"
num-bigint = "0.4"
base64 = "0.22"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
inherits = "release"
debug = 1

# The reference negentropy crate is only ever a test oracle; optimised, the
# interop tests over a million items run in seconds rather than half a minute.
[profile.dev.package.negentropy]
opt-level = 3

# libsecp256k1 (C) optimised in debug builds too: tests sign and verify
# hundreds of thousands of events, ten times slower unoptimised. Our own code
# stays at the debug level.
[profile.dev.package.secp256k1-sys]
opt-level = 3
